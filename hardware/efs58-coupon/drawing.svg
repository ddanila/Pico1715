<text x="595" y="456" class="dim">Gold = socket envelope; springs omitted</text>
<text x="595" y="478" class="dim">0.4 mm body/PCB gap, except at screw feet</text>
<text x="45" y="500" class="sub">Assembly</text>
<text x="45" y="530" class="small">1. Qualify a loose socket on a sacrificial EFS blade first.</text>
<text x="45" y="556" class="small">2. Insert four sockets into one body; close with the front plate.</text>
<text x="45" y="582" class="small">3. Fit PCB, align KEY, install two M2 × 12 screws and nuts.</text>
<text x="45" y="608" class="small">4. Solder from the PCB back; check four independent paths.</text>
<text x="45" y="654" class="dim">Print one front and the three clearance variants: c15 / c25 / c35.</text>
<text x="45" y="680" class="dim">Broad ears obstruct adjacent host pins. Use loose test pins; never force this fixture onto the motherboard.</text>
<text x="45" y="710" class="dim">Original MIT design • see README for sources, material limits and bench acceptance</text>
</svg>

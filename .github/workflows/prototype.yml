name: Prototype source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-and-rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - run: make test test-store test-firmware-service test-frontend test-irq test-pico-top test-bench-fixture lint-bench-fixture lint-frontend synth-frontend
      - run: make test-carrier test-carrier-rtl test-carrier-footprints test-carrier-pcb test-efs58 test-efs58-coupon test-desk-review test-x2-adapter test-pattern-workload test-backup-power test-sd-geometry
      - run: python3 tools/generate_efs58_reference.py && python3 tools/generate_carrier_mechanics.py && python3 tools/generate_carrier.py && git diff --exit-code -- hardware/carrier hardware/boards/hx8k-carrier-*
      - run: python3 tools/generate_backup_power.py && git diff --exit-code -- hardware/backup-power
      - run: make test-analyzer-hx8k lint-analyzer-hx8k test-carrier-combined test-combined-endpoint test-reserve-supervisor
      - run: python3 tools/build_firmware_faults.py --suite timing --combined --out build/combined-ci
      - run: build/combined-ci/firmware-timing --combined
      - run: python3 tools/check_analyzer_transport.py --out build/analyzer-transport-check
      - run: python3 tools/check_analyzer.py --out build/analyzer-report.json
      - run: verilator --lint-only -Wall --top-module pico1715_top hardware/rtl/pico1715_top.v hardware/rtl/bus_frontend.v hardware/rtl/irq_frontend.v
      - run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/store_test.c firmware/store.c -o build/store-sanitize && ./build/store-sanitize
      - run: cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -g -DP1715_HOST_SIM -Itools/firmware_host tests/firmware_service_test.c firmware/service.c firmware/store.c model/controller.c tools/firmware_host/host_hal.c -o build/firmware-service-ubsan && ./build/firmware-service-ubsan
      - run: verilator --lint-only -Wall --top-module firmware_cosim_top hardware/rtl/firmware_cosim_top.v hardware/rtl/pico1715_top.v hardware/rtl/bus_frontend.v hardware/rtl/irq_frontend.v
      - run: python3 tools/check_firmware_faults.py --out build/firmware-fault-report
      - run: python3 tools/check_firmware_interrupts.py --out build/firmware-interrupt-report
      - run: python3 tools/check_firmware_timing.py --out build/firmware-timing-report
      - run: python3 -m unittest discover -s tests -p test_bringup.py -v
      - run: python3 -m unittest discover -s tests -p test_source_map.py -v
      - run: python3 tools/check_controller_usb.py --out build/controller-usb-report
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: 98f8f808c08ce21f6b98a00b95185f1e2226e70d
          path: build/dac
      - run: make -C build/dac test-pc1715
      - run: python3 tools/check_onboard_keyboard.py --dac build/dac --out build/onboard-keyboard
      - run: python3 tools/check_motherboard_chain.py --dac build/dac --out build/motherboard-chain
      - run: python3 tools/check_cycle_analyzer.py --dac build/dac --out build/cycle-analyzer-check
      - run: python3 tools/check_cpu_cost_smoke.py --dac build/dac --out build/cpu-cost-check
      - run: python3 tests/firmware_cosim_smoke.py build/cpu-cost-check/build/classic-probe
      - run: python3 tests/keyboard_schedule_smoke.py build/cpu-cost-check/build/classic-probe
  browser-sessions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ddanila/dac-emulation
          ref: 98f8f808c08ce21f6b98a00b95185f1e2226e70d
          path: build/dac
      - uses: actions/checkout@v4
        with:
          repository: ddanila/cpm-plus-1715
          ref: eb56ac02134dcf2440ab433b2f47a1462c8e10d0
          path: build/cpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y verilator bison
      - run: git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git local/emsdk
      - run: local/emsdk/emsdk install 4.0.23 && local/emsdk/emsdk activate 4.0.23
      - run: make -C build/cpm all test-rom
      - run: make test-browser-session DAC=build/dac
      - run: python3 tools/build_browser.py --dac build/dac
      - run: python3 tools/build_analyzer_workbench.py --dac build/dac
      - run: python3 tools/build_browser.py --dac build/dac --native --out build/browser-native
      - run: python3 tools/check_session_capture.py --build build/browser-native --out build/capture-parity
      - run: node tools/browser/check-capture.mjs build/browser build/capture-parity
      - run: node --test tools/browser/experiment.test.mjs
      - run: node tools/browser/check-experiment.mjs build/browser-native build/browser
      - run: node tools/browser/check-fault-experiment.mjs build/browser-native build/browser
      - run: python3 tests/browser_parity.py --backend model --rom build/cpm/build/test.rom --disk build/cpm/out/cpm-plus-1715.img --out build/parity-model
      - run: python3 tests/browser_parity.py --backend firmware --rom build/cpm/build/test.rom --disk build/cpm/out/cpm-plus-1715.img --out build/parity-firmware
      - run: PICO1715_FORCE_CONTEXT=1 PICO1715_COST_POLL_US=1 PICO1715_TEST_RESET=1 python3 tests/browser_parity.py --backend firmware --rom build/cpm/build/test.rom --disk build/cpm/out/cpm-plus-1715.img --cycles 200000 --out build/parity-context
